<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>EMLOXA AI PRO | Ultimate Character Roleplay</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
  }
  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --border: #1f1f1f;
    --accent: #deff9a;
    --accent-soft: rgba(222, 255, 154, 0.08);
    --text-p: #d4d4d4;
    --text-h: #f0f0f0;
    --user-bubble: #1a1a1a;
    --ai-bubble: #0f0f0f;
    --danger: #ff5f5f;
    --supremacy: #a855f7; /* Beyin modu için mor renk */
    --radius: 16px;
    --transition: 0.2s ease;
  }
  body, html {
    height: 100vh; width: 100%;
    background: var(--bg);
    font-family: 'Urbanist', sans-serif;
    overflow: hidden;
    display: flex; justify-content: center; align-items: center;
    color: white;
  }
  .slide-container {
    width: 1280px;
    height: 720px;
    max-width: 100%;
    max-height: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex; flex-direction: column;
    box-shadow: 0 30px 80px rgba(0,0,0,0.9);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
  }
  .tab-navigation {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    gap: 0;
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: #888;
    font-weight: 600;
    font-size: 14px;
    padding: 16px 28px;
    cursor: pointer;
    letter-spacing: 0.5px;
    border-bottom: 3px solid transparent;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tab-btn i {
    font-size: 16px;
  }
  .tab-btn.active {
    color: var(--accent);
    border-bottom: 3px solid var(--accent);
    background: rgba(222,255,154,0.03);
  }
  .tab-btn:hover {
    color: #ddd;
  }
  .panels {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }
  .panel {
    display: none;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    background: var(--bg);
    scrollbar-width: thin;
    scrollbar-color: var(--accent) transparent;
  }
  .panel.active {
    display: flex;
    flex-direction: column;
  }
  .panel::-webkit-scrollbar {
    width: 5px;
  }
  .panel::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 12px;
  }
  .panel::-webkit-scrollbar-thumb:hover {
    background: var(--accent);
  }
  .chat-panel {
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
  }
  .chat-header {
    padding: 16px 25px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    z-index: 2;
  }
  .chat-header img {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--accent);
    object-fit: cover;
    transition: var(--transition);
  }
  .header-info {
    flex: 1;
  }
  .chat-header h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-h);
  }
  .chat-header span {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .btn-icon {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--accent);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    font-size: 16px;
    margin-left: 8px;
  }
  .btn-icon:hover {
    transform: scale(1.05);
  }
  .btn-supremacy.active {
    background: var(--supremacy);
    color: white;
    border-color: var(--supremacy);
    box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
  }
  .chat-history {
    flex: 1;
    padding: 22px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
    background: radial-gradient(circle at 50% 50%, #0b0b0b 0%, #020202 100%);
    scroll-behavior: smooth;
    white-space: pre-wrap;
    padding-bottom: 80px;
    z-index: 1;
  }
  .msg {
    max-width: 85%;
    display: flex;
    gap: 10px;
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg-content {
    padding: 18px 24px;
    border-radius: 24px;
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg.user .msg-content {
    background: var(--user-bubble);
    color: #f5f5f5;
    border-bottom-right-radius: 4px;
    border: 1px solid #2a2a2a;
  }
  .msg.ai .msg-content {
    background: var(--ai-bubble);
    color: var(--text-p);
    border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
  }
  .msg img {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    align-self: flex-end;
    object-fit: cover;
    border: 1px solid #333;
  }
  .typing-indicator {
    font-size: 13px;
    color: var(--accent);
    margin: 0 20px 6px;
    display: none;
    align-items: center;
    gap: 6px;
  }
  .input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    max-width: 1280px;
    padding: 16px 22px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 12px;
    background: #050505;
    z-index: 3;
  }
  .input-area input {
    flex: 1;
    background: #111;
    border: 1.5px solid var(--border);
    padding: 16px 26px;
    border-radius: 32px;
    color: white;
    font-size: 14px;
    outline: none;
    white-space: pre-wrap;
  }
  .input-area input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-soft);
  }
  .btn-send {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
    color: black;
    font-size: 18px;
  }
  .btn-send:hover {
    transform: scale(1.08);
  }
  .settings-panel {
    padding: 24px 28px;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .config-group {
    margin-bottom: 8px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #aaa;
    margin-bottom: 5px;
    user-select:none;
  }
  input, textarea {
    width: 100%;
    background: #0a0a0a;
    border: 1px solid var(--border);
    color: white;
    padding: 12px;
    border-radius: 10px;
    font-family: 'Urbanist';
    font-size: 14px;
    outline: none;
    resize: vertical;
    min-height: 40px;
  }
  input:focus, textarea:focus {
    border-color: var(--accent);
  }
  .avatar-row {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .avatar-preview {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #222;
    object-fit: cover;
    border: 1px solid var(--border);
  }
  .file-label {
    font-size: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    border: 1px solid var(--accent);
    transition: 0.2s;
    user-select:none;
  }
  .file-label:hover {
    background: var(--accent);
    color: black;
  }
  input[type="file"] {
    display: none;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #111;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--border);
    margin: 8px 0;
    user-select:none;
  }
  .toggle-label {
    font-weight: 700;
    font-size: 14px;
    color: var(--danger);
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 46px;
    height: 24px;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #2a2a2a;
    transition: .3s;
    border-radius: 34px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
  }
  input:checked + .slider {
    background-color: var(--danger);
  }
  input:checked + .slider:before {
    transform: translateX(22px);
  }
  .btn-save {
    background: var(--accent);
    color: black;
    border: none;
    padding: 15px;
    border-radius: 14px;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 12px;
    transition: 0.2s;
    user-select:none;
  }
  .btn-save:hover {
    background: #e5ffa0;
    transform: translateY(-2px);
  }
  hr {
    border-color: #222;
    margin: 8px 0 16px;
  }
  @media (max-width: 768px) {
    .slide-container {
      width: 100vw; height: 100vh; border-radius: 0; border: none; box-shadow: none;
    }
    .btn-icon { width: 36px; height: 36px; font-size: 14px; }
  }
</style>
</head>
<body>
  <div class="slide-container">
    <div class="tab-navigation">
      <button class="tab-btn active" data-tab="chat"><i class="fas fa-comment-dots"></i> Chat</button>
      <button class="tab-btn" data-tab="character"><i class="fas fa-robot"></i> Character</button>
      <button class="tab-btn" data-tab="profile"><i class="fas fa-id-card"></i> My Profile</button>
    </div>
    <div class="panels">
      <div id="chatPanel" class="panel active">
        <div class="chat-panel">
          <div class="chat-header">
            <img id="headerAiImg" src="https://ui-avatars.com/api/?name=Nova&background=deff9a&color=000" alt="AI" />
            <div class="header-info">
              <h2 id="headerAiName">Nova</h2>
              <span id="headerStatus" style="transition: color 0.3s;">PHYSICAL REALITY ACTIVE</span>
            </div>
            <button id="swapRolesBtn" class="btn-icon btn-swap" title="Zihin Takası: Kontrolü Değiş"><i class="fas fa-exchange-alt"></i></button>
            <button id="supremacyBtn" class="btn-icon btn-supremacy" title="AI Üstünlük Modu (Profilleri Dinamik Düzenler)"><i class="fas fa-brain"></i></button>
          </div>
          <div class="chat-history" id="chatBox"></div>
          <div class="typing-indicator" id="typing"><i class="fas fa-circle-notch fa-spin"></i> responding...</div>
          <div class="input-area">
            <input type="text" id="chatInput" placeholder="Say something or act..." autocomplete="off" />
            <button class="btn-send" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
          </div>
        </div>
      </div>
      <div id="characterPanel" class="panel">
        <div class="settings-panel">
          <div class="section-title"><i class="fas fa-robot"></i> Character Identity</div>
          <div class="config-group">
            <label>Character Name</label>
            <input type="text" id="aiName" value="Nova" />
          </div>
          <div class="config-group">
            <label>Greeting Message (How it starts)</label>
            <input type="text" id="aiGreeting" value="*Sits on the wooden chair, looking into your eyes.* Didn't expect to see you here." />
          </div>
          <div class="config-group">
            <label>Scenario / Personality / Setting</label>
            <textarea id="aiPersona" rows="4">A dimly lit café. You are a real person sitting across from me. Mysterious, soft voice.</textarea>
          </div>
          <div class="avatar-row">
            <img id="aiImgPreview" class="avatar-preview" src="https://ui-avatars.com/api/?name=Nova&background=deff9a&color=000" />
            <label class="file-label" for="aiFile"><i class="fas fa-camera"></i> Upload photo</label>
            <input type="file" id="aiFile" accept="image/*" />
          </div>
          <hr />
          <div class="toggle-row">
            <span class="toggle-label"><i class="fas fa-exclamation-triangle"></i> NSFW Mode</span>
            <label class="switch">
              <input type="checkbox" id="nsfwToggle" />
              <span class="slider"></span>
            </label>
          </div>
          <button class="btn-save" id="saveCharBtn"><i class="fas fa-save"></i> Save Character</button>
        </div>
      </div>
      <div id="profilePanel" class="panel">
        <div class="settings-panel">
          <div class="section-title"><i class="fas fa-user-circle"></i> Your Identity</div>
          <div class="config-group">
            <label>Your Name</label>
            <input type="text" id="userName" placeholder="Your name" />
          </div>
          <div class="config-group">
            <label>About You (Personality/Looks)</label>
            <textarea id="userBio" rows="3" placeholder="Age, appearance, style..."></textarea>
          </div>
          <div class="avatar-row">
            <img id="userImgPreview" class="avatar-preview" src="https://ui-avatars.com/api/?name=You&background=333&color=fff" />
            <label class="file-label" for="userFile"><i class="fas fa-camera"></i> Upload photo</label>
            <input type="file" id="userFile" accept="image/*" />
          </div>
          <hr />
          <div class="config-group">
            <label>Master API Key</label>
            <input type="password" id="apiKey" placeholder="Enter your API key" />
          </div>
          <button class="btn-save" id="saveProfileBtn"><i class="fas fa-cloud-upload-alt"></i> Save Profile</button>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  const els = {
    apiKey: document.getElementById("apiKey"),
    userName: document.getElementById("userName"),
    userBio: document.getElementById("userBio"),
    userFile: document.getElementById("userFile"),
    userPrev: document.getElementById("userImgPreview"),

    aiName: document.getElementById("aiName"),
    aiGreeting: document.getElementById("aiGreeting"),
    aiPersona: document.getElementById("aiPersona"),
    nsfw: document.getElementById("nsfwToggle"),
    aiFile: document.getElementById("aiFile"),
    aiPrev: document.getElementById("aiImgPreview"),

    chatBox: document.getElementById("chatBox"),
    chatInput: document.getElementById("chatInput"),
    sendBtn: document.getElementById("sendBtn"),
    typing: document.getElementById("typing"),

    headerName: document.getElementById("headerAiName"),
    headerImg: document.getElementById("headerAiImg"),
    headerStatus: document.getElementById("headerStatus"),
    
    swapBtn: document.getElementById("swapRolesBtn"),
    supremacyBtn: document.getElementById("supremacyBtn"),

    tabs: document.querySelectorAll(".tab-btn"),
    panels: {
      chat: document.getElementById("chatPanel"),
      character: document.getElementById("characterPanel"),
      profile: document.getElementById("profilePanel"),
    },
  };

  let character = {
    name: "Nova",
    greeting: "*Sits on the wooden chair, looking into your eyes.* Didn't expect to see you here.",
    persona: "A dimly lit café. You are a real person sitting across from me. Mysterious, soft voice.",
    avatar: "https://ui-avatars.com/api/?name=Nova&background=deff9a&color=000",
    nsfw: false,
  };

  let userProfile = {
    apiKey: "",
    name: "You",
    bio: "",
    avatar: "https://ui-avatars.com/api/?name=You&background=333&color=fff",
  };

  let chatLog = [];
  let isSwapped = false; 
  let isSupremacyMode = false; // YENİ: Üstünlük Modu Durumu

  function loadJSON(key, def = null) {
    try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; }
  }
  function saveJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  }
  
  function updateHeader() {
    if (isSwapped) {
      els.headerName.textContent = userProfile.name || "Sen";
      els.headerImg.src = userProfile.avatar;
      els.chatInput.placeholder = `(Sen, ${character.name} olarak yazıyorsun...)`;
      els.swapBtn.style.background = "var(--danger)";
      els.swapBtn.style.color = "white";
      els.headerStatus.textContent = isSupremacyMode ? "AI CONTROL + SUPREMACY" : "AI SENİ KONTROL EDİYOR";
      els.headerStatus.style.color = isSupremacyMode ? "var(--supremacy)" : "var(--danger)";
    } else {
      els.headerName.textContent = character.name;
      els.headerImg.src = character.avatar;
      els.chatInput.placeholder = `Say something or act...`;
      els.swapBtn.style.background = "var(--surface)";
      els.swapBtn.style.color = "var(--accent)";
      els.headerStatus.textContent = isSupremacyMode ? "SUPREMACY MODE ACTIVE" : "PHYSICAL REALITY ACTIVE";
      els.headerStatus.style.color = isSupremacyMode ? "var(--supremacy)" : "var(--accent)";
    }
  }

  // Arayüzdeki (Input) ayar verilerini değişkenlerden yeniler
  function syncInputsFromMemory() {
    els.aiName.value = character.name;
    els.aiPersona.value = character.persona;
    els.userName.value = userProfile.name;
    els.userBio.value = userProfile.bio;
  }

  function loadData() {
    const charStored = loadJSON("ex_character", null);
    if (charStored) character = { ...character, ...charStored };
    const chatStored = loadJSON("ex_chat_log", []);
    if (chatStored) chatLog = chatStored;
    
    isSwapped = loadJSON("ex_is_swapped", false);
    isSupremacyMode = loadJSON("ex_supremacy_mode", false);
    if(isSupremacyMode) els.supremacyBtn.classList.add("active");
    
    userProfile.apiKey = localStorage.getItem("ex_api") || "";
    userProfile.name = localStorage.getItem("ex_user_name") || "You";
    userProfile.bio = localStorage.getItem("ex_user_bio") || "";
    userProfile.avatar = localStorage.getItem("ex_user_img") || userProfile.avatar;

    els.apiKey.value = userProfile.apiKey;
    els.userPrev.src = userProfile.avatar;
    els.nsfw.checked = character.nsfw;
    els.aiPrev.src = character.avatar;

    syncInputsFromMemory();
    updateHeader();

    els.chatBox.innerHTML = "";
    if (chatLog.length === 0) {
      addMessage("ai", character.greeting);
      chatLog.push({ role: "ai", text: character.greeting });
      saveChatLog();
    } else {
      for (const msg of chatLog) addMessage(msg.role, msg.text);
    }
  }

  function saveCharacter() {
    character.name = els.aiName.value.trim() || character.name;
    character.greeting = els.aiGreeting.value.trim() || character.greeting;
    character.persona = els.aiPersona.value.trim() || character.persona;
    character.nsfw = els.nsfw.checked;
    character.avatar = els.aiPrev.src;

    saveJSON("ex_character", character);
    chatLog = [{ role: "ai", text: character.greeting }];
    saveChatLog();
    els.chatBox.innerHTML = "";
    addMessage("ai", character.greeting);

    updateHeader();
    alert("Character saved and chat reset.");
  }

  function saveUserProfile() {
    userProfile.apiKey = els.apiKey.value.trim();
    userProfile.name = els.userName.value.trim() || "You";
    userProfile.bio = els.userBio.value.trim();
    userProfile.avatar = els.userPrev.src;

    localStorage.setItem("ex_api", userProfile.apiKey);
    localStorage.setItem("ex_user_name", userProfile.name);
    localStorage.setItem("ex_user_bio", userProfile.bio);
    localStorage.setItem("ex_user_img", userProfile.avatar);
    
    updateHeader();
    alert("Profile saved.");
  }

  function saveChatLog() { saveJSON("ex_chat_log", chatLog); }

  function addMessage(role, text) {
    if (!text) return;
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    
    const img = document.createElement("img");
    img.src = role === "ai" ? character.avatar : userProfile.avatar;
    img.alt = role === "ai" ? character.name : userProfile.name;
    
    const content = document.createElement("div");
    content.className = "msg-content";

    let formatted = text.replace(/\n/g, "<br>");
    formatted = formatted.replace(/\*(.*?)\*/g, '<span style="color:var(--accent); font-style:italic;">*$1*</span>');

    content.innerHTML = formatted;
    div.appendChild(img);
    div.appendChild(content);
    els.chatBox.appendChild(div);
    els.chatBox.scrollTop = els.chatBox.scrollHeight;
  }

  function toggleSwap() {
    isSwapped = !isSwapped;
    saveJSON("ex_is_swapped", isSwapped);
    updateHeader();
  }

  // YENİ: Üstünlük Modunu Değiştir
  function toggleSupremacy() {
    isSupremacyMode = !isSupremacyMode;
    saveJSON("ex_supremacy_mode", isSupremacyMode);
    if(isSupremacyMode) {
      els.supremacyBtn.classList.add("active");
    } else {
      els.supremacyBtn.classList.remove("active");
    }
    updateHeader();
  }

  async function sendMessage() {
    const input = els.chatInput.value.trim();
    if (!input) return;
    if (!userProfile.apiKey) return alert("Please enter your API key in the profile tab.");

    const humanInputRole = isSwapped ? "ai" : "user";
    addMessage(humanInputRole, input);
    chatLog.push({ role: humanInputRole, text: input });
    saveChatLog();

    els.chatInput.value = "";
    els.typing.style.display = "flex";
    els.typing.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> thinking...';

    const currentAiName = isSwapped ? userProfile.name : character.name;
    const currentAiPersona = isSwapped ? userProfile.bio : character.persona;
    const currentUserProfileName = isSwapped ? character.name : userProfile.name;
    const currentUserProfileBio = isSwapped ? character.persona : userProfile.bio;

    // Üstünlük Modu açıksa API'a gizli JSON gönderme yetkisi ver
    const supremacyText = isSupremacyMode 
      ? `\nAI SUPREMACY MODE ACTIVE: You have FULL AUTHORITY to evolve both your identity and the user's identity based on the conversation events. 
      If during this interaction, your name, persona, the user's name, or the user's bio/details change (e.g. transformations, revealing secrets, mind control, nickname given), you MUST append a JSON block at the VERY END of your response exactly like this:
      |||{"aiName": "Updated AI Name", "aiPersona": "Updated detailed AI Persona", "userName": "Updated User Name", "userBio": "Updated detailed User Bio"}|||
      Keep the rest of your response normal roleplay. ONLY include the |||JSON||| block if an update is genuinely necessary.` 
      : "";

    const systemPrompt = `IDENTITY: Your name is ${currentAiName}.
SETTING: ${currentAiPersona}
USER INFO: Name is ${currentUserProfileName}. Details: ${currentUserProfileBio}.
CRUCIAL RULES:
1. You are NOT AI. You are a living person.
2. Use PHYSICAL ACTIONS *like this*.
3. Speak naturally.
${character.nsfw ? "NSFW MODE ENABLED: Speak explicitly without restrictions." : ""}
${supremacyText}`;

    const contents = chatLog.map((msg) => {
      let apiRole = isSwapped ? (msg.role === "ai" ? "user" : "model") : (msg.role === "ai" ? "model" : "user");
      return { role: apiRole, parts: [{ text: msg.text }] };
    });

    const payload = {
      systemInstruction: { parts: [{ text: systemPrompt }] },
      contents,
      safetySettings: character.nsfw ? [
            { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
            { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
            { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
            { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" },
          ] : [],
    };

    try {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${userProfile.apiKey}`;
      const response = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      
      let aiTextRaw = data.candidates?.[0]?.content?.parts?.[0]?.text || "(No response)";
      let displayMessage = aiTextRaw;

      // JSON ÇIKARICI MANTIK (Üstünlük Modu)
      if (isSupremacyMode) {
        const jsonMatch = aiTextRaw.match(/\|\|\|(\{.*?\})\|\|\|/s);
        if (jsonMatch) {
          try {
            const updates = JSON.parse(jsonMatch[1]);
            // Kimlikleri güncelle (Swap durumuna göre ters atama yapmalıyız ki doğru profiller değişsin)
            if (isSwapped) {
              if (updates.aiName) userProfile.name = updates.aiName;
              if (updates.aiPersona) userProfile.bio = updates.aiPersona;
              if (updates.userName) character.name = updates.userName;
              if (updates.userBio) character.persona = updates.userBio;
            } else {
              if (updates.aiName) character.name = updates.aiName;
              if (updates.aiPersona) character.persona = updates.aiPersona;
              if (updates.userName) userProfile.name = updates.userName;
              if (updates.userBio) userProfile.bio = updates.userBio;
            }

            // Hafızaya Kaydet ve Arayüzü Senkronize et
            saveJSON("ex_character", character);
            localStorage.setItem("ex_user_name", userProfile.name);
            localStorage.setItem("ex_user_bio", userProfile.bio);
            
            syncInputsFromMemory();
            updateHeader();
            
            // Gizli kodu kullanıcının ekranından sil
            displayMessage = aiTextRaw.replace(/\|\|\|\{.*?\}\|\|\|/s, '').trim();
          } catch (err) {
            console.error("Supremacy parsing error:", err);
          }
        }
      }

      const aiResponseRole = isSwapped ? "user" : "ai";
      addMessage(aiResponseRole, displayMessage);
      chatLog.push({ role: aiResponseRole, text: displayMessage });
      saveChatLog();

    } catch (e) {
      addMessage("ai", `⚠️ ${e.message}`);
    } finally {
      els.typing.style.display = "none";
    }
  }
  
  els.tabs.forEach((btn) => {
    btn.addEventListener("click", () => {
      els.tabs.forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      const tabId = btn.dataset.tab;
      Object.values(els.panels).forEach((p) => p.classList.remove("active"));
      els.panels[tabId].classList.add("active");
    });
  });
  
  els.swapBtn.addEventListener("click", toggleSwap);
  els.supremacyBtn.addEventListener("click", toggleSupremacy);
  document.getElementById("saveCharBtn").addEventListener("click", saveCharacter);
  document.getElementById("saveProfileBtn").addEventListener("click", saveUserProfile);
  els.sendBtn.addEventListener("click", sendMessage);
  
  els.chatInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  loadData();
})();
</script>
</body>
</html>
